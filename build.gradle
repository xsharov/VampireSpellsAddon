plugins {
    id 'base'
}

group = mod_group_id
version = mod_version

def platformProjects = [
        project(':platforms:mc1_21_1'),
        project(':platforms:mc1_20_1')
]

platformProjects.each { platformProject ->
    evaluationDependsOn(platformProject.path)
}

tasks.named('clean') {
    dependsOn platformProjects.collect { it.tasks.named('clean') }
}

tasks.named('assemble') {
    dependsOn platformProjects.collect { it.tasks.named('assemble') }
}

tasks.named('check') {
    dependsOn platformProjects.collect { it.tasks.named('check') }
}

tasks.named('build') {
    dependsOn platformProjects.collect { it.tasks.named('build') }
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs the shared unit tests against both supported Minecraft targets.'
    dependsOn platformProjects.collect { it.tasks.named('test') }
}

tasks.register('resolveParentRuntime') {
    group = 'verification'
    description = 'Resolves parent-mod runtime artifacts for both supported targets.'
    dependsOn platformProjects.collect { it.tasks.named('resolveParentRuntime') }
}

tasks.register('collectReleaseJars', Sync) {
    group = 'build'
    description = 'Collects the two verified main JARs into build/release.'
    dependsOn platformProjects.collect { it.tasks.named('verifyJarContents') }
    into layout.buildDirectory.dir('release')

    platformProjects.each { platformProject ->
        from(platformProject.tasks.named('jar').flatMap { it.archiveFile })
    }
}
