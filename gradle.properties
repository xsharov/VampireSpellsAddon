mod_authors=xsharov
mod_description=Adds vampire-specific rebalancing for Iron's Spells 'n Spellbooks when Vampirism is installed
mod_credits=Based on Iron's Spells 'n Spellbooks by Iron431 and Vampirism by maxanier & cheaterpaul
mod_display_url=https://github.com/xsharov/VampireSpellsAddon
mod_issue_tracker=https://github.com/xsharov/VampireSpellsAddon/issues
