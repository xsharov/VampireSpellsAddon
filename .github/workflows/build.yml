name: Release

on:
  pull_request_target:
    branches:
      - master
    types:
      - closed

permissions: {}

concurrency:
  group: vampire-spells-addon-release-master
  queue: max

jobs:
  reserve:
    if: github.event.pull_request.merged == true
    name: Reserve release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_version: ${{ steps.version.outputs.release_version }}
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Reserve release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if ! properties="$(
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/gradle.properties?ref=${MERGE_SHA}"
          )"; then
            exit 1
          fi

          base_version="$(printf '%s\n' "$properties" | sed -n 's/^mod_version=//p' | tr -d '\r')"
          if [[ ! "$base_version" =~ ^1\.21\.1-([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "mod_version must use the canonical 1.21.1-X.Y.Z release line: $base_version" >&2
            exit 1
          fi
          version_prefix="1.21.1-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          base_patch="${BASH_REMATCH[3]}"

          highest_patch=$((10#$base_patch))
          release_marker='<!-- vampire-spells-addon-release-workflow -->'
          existing_version=""
          stale_draft_tag=""
          stale_draft_target=""
          stale_draft_author=""
          stale_draft_managed=""
          stale_draft_deleted=false
          latest_tag_name=""
          latest_tag_sha=""
          latest_tag_patch=-1
          declare -A tag_shas=()

          if ! tag_rows="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${version_prefix}." \
              --jq '.[] | [.ref, .object.type, .object.sha] | @tsv'
          )"; then
            exit 1
          fi

          while IFS=$'\t' read -r tag_ref object_type object_sha; do
            [[ -n "$tag_ref" ]] || continue

            tag_name="${tag_ref#refs/tags/}"
            tag_patch="${tag_name#${version_prefix}.}"
            [[ "$tag_name" == "${version_prefix}."* && "$tag_patch" =~ ^[0-9]+$ ]] || continue

            numeric_patch=$((10#$tag_patch))
            if (( numeric_patch > highest_patch )); then
              highest_patch=$numeric_patch
            fi

            while [[ "$object_type" == "tag" ]]; do
              if ! tag_object="$(
                gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )"; then
                exit 1
              fi
              IFS=$'\t' read -r object_type object_sha <<< "$tag_object"
            done

            if [[ "$object_type" != "commit" ]]; then
              echo "Release tag $tag_name points to unsupported object type $object_type" >&2
              exit 1
            fi

            tag_shas["$tag_name"]="$object_sha"
            if (( numeric_patch > latest_tag_patch )); then
              latest_tag_patch=$numeric_patch
              latest_tag_name="$tag_name"
              latest_tag_sha="$object_sha"
            fi
            if [[ "$object_sha" == "$MERGE_SHA" ]]; then
              if [[ -n "$existing_version" && "$existing_version" != "$tag_name" ]]; then
                echo "Merge commit $MERGE_SHA has multiple release versions" >&2
                exit 1
              fi
              existing_version="$tag_name"
            fi
          done <<< "$tag_rows"

          if [[ -n "$latest_tag_sha" && "$latest_tag_sha" != "$MERGE_SHA" ]]; then
            if ! comparison_status="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${MERGE_SHA}...${latest_tag_sha}" \
                --jq '.status'
            )"; then
              exit 1
            fi
            case "$comparison_status" in
              ahead)
                echo "version=$latest_tag_name" >> "$GITHUB_OUTPUT"
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                echo "Skipping stale merge $MERGE_SHA because $latest_tag_name already contains it"
                exit 0
                ;;
              behind)
                ;;
              *)
                echo "Latest release tag $latest_tag_name is not an ancestor of merge $MERGE_SHA" >&2
                exit 1
                ;;
            esac
          fi

          if ! draft_rows="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == true) | [.tag_name, .target_commitish, .author.login, ((.body // "") | contains("<!-- vampire-spells-addon-release-workflow -->"))] | @tsv'
          )"; then
            exit 1
          fi

          while IFS=$'\t' read -r draft_tag draft_target draft_author draft_managed; do
            [[ -n "$draft_tag" ]] || continue
            draft_patch="${draft_tag#${version_prefix}.}"
            [[ "$draft_tag" == "${version_prefix}."* && "$draft_patch" =~ ^[0-9]+$ ]] || continue

            numeric_patch=$((10#$draft_patch))
            if (( numeric_patch > highest_patch )); then
              highest_patch=$numeric_patch
            fi

            if [[ "$draft_target" == "$MERGE_SHA" ]]; then
              if [[ "$draft_author" != "github-actions[bot]" || "$draft_managed" != "true" ]]; then
                echo "Draft release $draft_tag was not created by this workflow" >&2
                exit 1
              fi
              if [[ -n "$existing_version" && "$existing_version" != "$draft_tag" ]]; then
                echo "Merge commit $MERGE_SHA has multiple release versions" >&2
                exit 1
              fi
              existing_version="$draft_tag"
            else
              if [[ -n "$stale_draft_tag" && "$stale_draft_tag" != "$draft_tag" ]]; then
                echo "Multiple unfinished draft releases block automatic recovery" >&2
                exit 1
              fi
              stale_draft_tag="$draft_tag"
              stale_draft_target="$draft_target"
              stale_draft_author="$draft_author"
              stale_draft_managed="$draft_managed"
            fi
          done <<< "$draft_rows"

          if [[ -n "$stale_draft_tag" ]]; then
            if [[ -n "$existing_version" ]]; then
              echo "Release state contains drafts for both the current and an older merge" >&2
              exit 1
            fi
            if [[ "$stale_draft_author" != "github-actions[bot]" || "$stale_draft_managed" != "true" ]]; then
              echo "Draft release $stale_draft_tag was not created by this workflow" >&2
              exit 1
            fi
            if [[ ! "$stale_draft_target" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Draft release $stale_draft_tag has an unsafe target: $stale_draft_target" >&2
              exit 1
            fi

            if ! comparison_status="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${stale_draft_target}...${MERGE_SHA}" \
                --jq '.status'
            )"; then
              exit 1
            fi
            if [[ "$comparison_status" != "ahead" ]]; then
              echo "Merge commit $MERGE_SHA is not a descendant of draft target $stale_draft_target" >&2
              exit 1
            fi

            stale_tag_sha="${tag_shas[$stale_draft_tag]:-}"
            if [[ -n "$stale_tag_sha" && "$stale_tag_sha" != "$stale_draft_target" ]]; then
              echo "Draft tag $stale_draft_tag points to $stale_tag_sha instead of $stale_draft_target" >&2
              exit 1
            fi

            if [[ -n "$stale_tag_sha" ]]; then
              gh release delete "$stale_draft_tag" --cleanup-tag --yes
            else
              gh release delete "$stale_draft_tag" --yes
            fi
            unset 'tag_shas[$stale_draft_tag]'
            existing_version="$stale_draft_tag"
            stale_draft_deleted=true
            echo "Reusing $stale_draft_tag for descendant merge $MERGE_SHA"
          fi

          if [[ -n "$existing_version" ]]; then
            build_version="$existing_version"
          else
            build_version="${version_prefix}.$((highest_patch + 1))"
          fi

          selected_tag_sha="${tag_shas[$build_version]:-}"
          if [[ -n "$selected_tag_sha" && "$selected_tag_sha" != "$MERGE_SHA" ]]; then
            echo "Release tag $build_version points to $selected_tag_sha instead of $MERGE_SHA" >&2
            exit 1
          fi

          read_release() {
            local rows tag_name is_draft target author managed found=""
            if ! rows="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | [.tag_name, .draft, .target_commitish, .author.login, ((.body // "") | contains("<!-- vampire-spells-addon-release-workflow -->"))] | @tsv'
            )"; then
              return 1
            fi
            while IFS=$'\t' read -r tag_name is_draft target author managed; do
              [[ "$tag_name" == "$build_version" ]] || continue
              if [[ -n "$found" ]]; then
                echo "GitHub returned duplicate releases for tag $build_version" >&2
                return 1
              fi
              found="${is_draft}"$'\t'"${target}"$'\t'"${author}"$'\t'"${managed}"
            done <<< "$rows"
            printf '%s' "$found"
          }

          create_draft_release() {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f "tag_name=$build_version" \
              -f "target_commitish=$MERGE_SHA" \
              -f "name=Vampire Spells Addon $build_version" \
              -f "body=${release_marker}"$'\n\n'"Built automatically after merging pull request #$PR_NUMBER into master." \
              -F draft=true \
              -F generate_release_notes=true \
              --jq '[.draft, .target_commitish, .author.login, ((.body // "") | contains("<!-- vampire-spells-addon-release-workflow -->"))] | @tsv'
          }

          # GitHub's release list can lag behind creates and deletes. Trust the
          # create response, and retry only while verified workflow state settles.
          reserve_draft_release() {
            local attempt current_info current_is_draft current_target current_author current_managed created_info
            for attempt in 1 2 3 4 5 6; do
              if ! current_info="$(read_release)"; then
                return 1
              fi
              if [[ -n "$current_info" ]]; then
                IFS=$'\t' read -r current_is_draft current_target current_author current_managed <<< "$current_info"
                if [[ "$current_is_draft" == "true" && "$current_target" == "$MERGE_SHA" && \
                      "$current_author" == "github-actions[bot]" && "$current_managed" == "true" ]]; then
                  printf '%s' "$current_info"
                  return 0
                fi
                if [[ "$stale_draft_deleted" != "true" || "$current_is_draft" != "true" || \
                      "$current_target" != "$stale_draft_target" || "$current_author" != "$stale_draft_author" || \
                      "$current_managed" != "$stale_draft_managed" ]]; then
                  echo "Release $build_version changed unexpectedly while reserving the version" >&2
                  return 1
                fi
              elif created_info="$(create_draft_release)"; then
                if [[ -z "$created_info" ]]; then
                  echo "GitHub returned no data after creating draft release $build_version" >&2
                  return 1
                fi
                printf '%s' "$created_info"
                return 0
              else
                echo "Draft creation attempt $attempt of 6 did not complete; checking GitHub state before retry" >&2
              fi
              if (( attempt < 6 )); then
                sleep 2
              fi
            done
            echo "Could not reserve draft release $build_version after 6 attempts" >&2
            return 1
          }

          if [[ "$stale_draft_deleted" == "true" ]]; then
            release_info=""
          else
            release_info="$(read_release)"
          fi
          if [[ -z "$release_info" ]]; then
            if ! release_info="$(reserve_draft_release)"; then
              exit 1
            fi
          fi

          IFS=$'\t' read -r release_is_draft release_target release_author release_managed <<< "$release_info"
          if [[ "$release_is_draft" == "true" && \
                ( "$release_author" != "github-actions[bot]" || "$release_managed" != "true" ) ]]; then
            echo "Draft release $build_version was not created by this workflow" >&2
            exit 1
          fi
          if [[ "$release_is_draft" == "true" && "$release_target" != "$MERGE_SHA" ]]; then
            echo "Draft release $build_version targets $release_target instead of $MERGE_SHA" >&2
            exit 1
          fi
          if [[ "$release_is_draft" != "true" && "$selected_tag_sha" != "$MERGE_SHA" ]]; then
            echo "Published release $build_version is not tagged at $MERGE_SHA" >&2
            exit 1
          fi

          if [[ ! "$build_version" =~ ^1\.21\.1-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Reserved version is outside the canonical release line: $build_version" >&2
            exit 1
          fi
          release_version="${BASH_REMATCH[1]}"

          echo "version=$build_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Reserved release version $build_version"

  build:
    name: Build ${{ matrix.minecraft }} / ${{ matrix.loader }}
    needs: reserve
    if: needs.reserve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.1
            loader: NeoForge
            java: "21"
            project: :platforms:mc1_21_1
            project_dir: platforms/mc1_21_1
            artifact_loader: neoforge
            floor_loader: neo_version=21.1.200
            floor_vampirism: 1.21-1.10.7
            floor_irons_spells: 1.21.1-3.14.3
          - minecraft: 1.20.1
            loader: Forge
            java: "17"
            project: :platforms:mc1_20_1
            project_dir: platforms/mc1_20_1
            artifact_loader: forge
            floor_loader: forge_version=47.4.0
            floor_vampirism: 1.20.1-1.10.7
            floor_irons_spells: 1.20.1-3.15.0

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify
        run: >-
          ./gradlew --no-daemon
          "${{ matrix.project }}:clean"
          "${{ matrix.project }}:build"
          "${{ matrix.project }}:resolveParentRuntime"
          --stacktrace
          -Pmod_version="${{ needs.reserve.outputs.version }}"

      - name: Smoke-test current parent runtime
        run: >-
          ./gradlew --no-daemon
          "${{ matrix.project }}:runGameTestServer"
          --stacktrace
          -Pmod_version="${{ needs.reserve.outputs.version }}"

      - name: Smoke-test parent compatibility floors
        run: >-
          ./gradlew --no-daemon
          "${{ matrix.project }}:runGameTestServer"
          --stacktrace
          -Pmod_version="${{ needs.reserve.outputs.version }}"
          -P${{ matrix.floor_loader }}
          -Pvampirism_runtime_version="${{ matrix.floor_vampirism }}"
          -Pirons_spells_runtime_version="${{ matrix.floor_irons_spells }}"

      - name: Store release JAR for publishing
        uses: actions/upload-artifact@v7
        with:
          name: vampire_spells_addon-${{ matrix.artifact_loader }}-${{ matrix.minecraft }}-${{ needs.reserve.outputs.release_version }}.jar
          path: ${{ matrix.project_dir }}/build/libs/vampire_spells_addon-${{ matrix.artifact_loader }}-${{ matrix.minecraft }}-${{ needs.reserve.outputs.release_version }}.jar
          if-no-files-found: error
          retention-days: 30
          overwrite: true
          archive: false

  publish:
    name: Publish GitHub Release
    needs:
      - reserve
      - build
    if: needs.reserve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified NeoForge JAR
        uses: actions/download-artifact@v8
        with:
          name: vampire_spells_addon-neoforge-1.21.1-${{ needs.reserve.outputs.release_version }}.jar
          path: release

      - name: Download verified Forge JAR
        uses: actions/download-artifact@v8
        with:
          name: vampire_spells_addon-forge-1.20.1-${{ needs.reserve.outputs.release_version }}.jar
          path: release

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.reserve.outputs.version }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.release_version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          release_tag="$BUILD_VERSION"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || \
                "$release_tag" != "1.21.1-${RELEASE_VERSION}" ]]; then
            echo "Release version outputs disagree: $release_tag / $RELEASE_VERSION" >&2
            exit 1
          fi

          expected_asset_names=(
            "vampire_spells_addon-neoforge-1.21.1-${RELEASE_VERSION}.jar"
            "vampire_spells_addon-forge-1.20.1-${RELEASE_VERSION}.jar"
          )
          declare -A expected_files=()
          declare -A expected_digests=()
          declare -A allowed_local_paths=()

          for asset_name in "${expected_asset_names[@]}"; do
            asset_path="release/${asset_name}"
            expected_files["$asset_name"]="$asset_path"
            allowed_local_paths["$asset_path"]=true
            if [[ ! -f "$asset_path" ]]; then
              echo "Expected release JAR was not downloaded: $asset_path" >&2
              exit 1
            fi
            expected_digests["$asset_name"]="sha256:$(sha256sum "$asset_path" | cut -d ' ' -f 1)"
          done

          mapfile -t downloaded_files < <(find release -type f -print | sort)
          if (( ${#downloaded_files[@]} != ${#expected_asset_names[@]} )); then
            echo "Expected exactly ${#expected_asset_names[@]} downloaded release files, found ${#downloaded_files[@]}" >&2
            printf '  %s\n' "${downloaded_files[@]}" >&2
            exit 1
          fi
          for downloaded_file in "${downloaded_files[@]}"; do
            if [[ -z "${allowed_local_paths[$downloaded_file]+present}" ]]; then
              echo "Unexpected downloaded release file: $downloaded_file" >&2
              exit 1
            fi
          done

          resolve_tag_sha() {
            local requested_tag="$1"
            local rows tag_ref object_type object_sha resolved_sha=""

            if ! rows="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${requested_tag}" \
                --jq '.[] | [.ref, .object.type, .object.sha] | @tsv'
            )"; then
              return 1
            fi
            while IFS=$'\t' read -r tag_ref object_type object_sha; do
              [[ "$tag_ref" == "refs/tags/${requested_tag}" ]] || continue

              while [[ "$object_type" == "tag" ]]; do
                local tag_object
                if ! tag_object="$(
                  gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                    --jq '[.object.type, .object.sha] | @tsv'
                )"; then
                  return 1
                fi
                IFS=$'\t' read -r object_type object_sha <<< "$tag_object"
              done

              if [[ "$object_type" != "commit" ]]; then
                echo "Release tag $requested_tag points to unsupported object type $object_type" >&2
                return 1
              fi
              if [[ -n "$resolved_sha" ]]; then
                echo "GitHub returned duplicate refs for release tag $requested_tag" >&2
                return 1
              fi
              resolved_sha="$object_sha"
            done <<< "$rows"

            printf '%s' "$resolved_sha"
          }

          read_asset() {
            local wanted_name="$1"
            local rows tag_name name state digest found=""
            if ! rows="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | .tag_name as $tag | .assets[] | [$tag, .name, .state, (.digest // "")] | @tsv'
            )"; then
              return 1
            fi
            while IFS=$'\t' read -r tag_name name state digest; do
              [[ "$tag_name" == "$release_tag" && "$name" == "$wanted_name" ]] || continue
              if [[ -n "$found" ]]; then
                echo "Release $release_tag contains duplicate assets named $wanted_name" >&2
                return 1
              fi
              found="${state}"$'\t'"${digest}"
            done <<< "$rows"
            printf '%s' "$found"
          }

          validate_release_asset_allowlist() {
            local rows tag_name name state digest
            local -A seen=()
            if ! rows="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | .tag_name as $tag | .assets[] | [$tag, .name, .state, (.digest // "")] | @tsv'
            )"; then
              return 1
            fi
            while IFS=$'\t' read -r tag_name name state digest; do
              [[ "$tag_name" == "$release_tag" ]] || continue
              if [[ -z "${expected_files[$name]+present}" ]]; then
                echo "Release $release_tag contains unexpected asset $name" >&2
                return 1
              fi
              if [[ -n "${seen[$name]+present}" ]]; then
                echo "Release $release_tag contains duplicate assets named $name" >&2
                return 1
              fi
              seen["$name"]=true
            done <<< "$rows"
          }

          read_release() {
            local rows tag_name is_draft target author managed found=""
            if ! rows="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | [.tag_name, .draft, .target_commitish, .author.login, ((.body // "") | contains("<!-- vampire-spells-addon-release-workflow -->"))] | @tsv'
            )"; then
              return 1
            fi
            while IFS=$'\t' read -r tag_name is_draft target author managed; do
              [[ "$tag_name" == "$release_tag" ]] || continue
              if [[ -n "$found" ]]; then
                echo "GitHub returned duplicate releases for tag $release_tag" >&2
                return 1
              fi
              found="${is_draft}"$'\t'"${target}"$'\t'"${author}"$'\t'"${managed}"
            done <<< "$rows"
            printf '%s' "$found"
          }

          tag_sha="$(resolve_tag_sha "$release_tag")"
          if [[ -n "$tag_sha" && "$tag_sha" != "$MERGE_SHA" ]]; then
            echo "Release tag $release_tag points to $tag_sha instead of $MERGE_SHA" >&2
            exit 1
          fi

          release_info="$(read_release)"
          if [[ -z "$release_info" ]]; then
            echo "Reserved release $release_tag disappeared before publishing" >&2
            exit 1
          fi

          IFS=$'\t' read -r release_is_draft release_target release_author release_managed <<< "$release_info"
          if [[ "$release_is_draft" == "true" && \
                ( "$release_author" != "github-actions[bot]" || "$release_managed" != "true" ) ]]; then
            echo "Draft release $release_tag was not created by this workflow" >&2
            exit 1
          fi
          if [[ -z "$tag_sha" && "$release_is_draft" != "true" ]]; then
            echo "Published release $release_tag exists without its Git tag" >&2
            exit 1
          fi
          if [[ "$release_is_draft" == "true" && "$release_target" != "$MERGE_SHA" ]]; then
            echo "Draft release $release_tag targets $release_target instead of $MERGE_SHA" >&2
            exit 1
          fi

          validate_release_asset_allowlist

          for asset_name in "${expected_asset_names[@]}"; do
            asset_path="${expected_files[$asset_name]}"
            expected_digest="${expected_digests[$asset_name]}"
            asset_info="$(read_asset "$asset_name")"
            asset_state=""
            asset_digest=""
            if [[ -n "$asset_info" ]]; then
              IFS=$'\t' read -r asset_state asset_digest <<< "$asset_info"
            fi

            if [[ -n "$asset_state" && \
                  ( "$asset_state" != "uploaded" || "$asset_digest" != "$expected_digest" ) ]]; then
              if [[ "$release_is_draft" != "true" ]]; then
                echo "Published release $release_tag contains an invalid $asset_name" >&2
                exit 1
              fi
              gh release delete-asset "$release_tag" "$asset_name" --yes
              for attempt in 1 2 3 4 5 6; do
                asset_info="$(read_asset "$asset_name")"
                asset_state=""
                asset_digest=""
                if [[ -n "$asset_info" ]]; then
                  IFS=$'\t' read -r asset_state asset_digest <<< "$asset_info"
                fi
                if [[ -z "$asset_state" ]]; then
                  break
                fi
                if (( attempt < 6 )); then
                  sleep 2
                fi
              done
              if [[ -n "$asset_state" ]]; then
                echo "Deleted release asset $asset_name is still visible" >&2
                exit 1
              fi
            fi

            if [[ -z "$asset_state" ]]; then
              if [[ "$release_is_draft" != "true" ]]; then
                echo "Published release $release_tag is missing $asset_name" >&2
                exit 1
              fi
              gh release upload "$release_tag" "$asset_path"
            else
              echo "Release $release_tag already contains the verified $asset_name"
            fi

            for attempt in 1 2 3 4 5 6; do
              asset_info="$(read_asset "$asset_name")"
              asset_state=""
              asset_digest=""
              if [[ -n "$asset_info" ]]; then
                IFS=$'\t' read -r asset_state asset_digest <<< "$asset_info"
              fi
              if [[ "$asset_state" == "uploaded" && "$asset_digest" == "$expected_digest" ]]; then
                break
              fi
              if (( attempt < 6 )); then
                sleep 2
              fi
            done
            if [[ "$asset_state" != "uploaded" || "$asset_digest" != "$expected_digest" ]]; then
              echo "Release asset verification failed for $asset_name" >&2
              exit 1
            fi
          done

          validate_release_asset_allowlist

          if [[ "$release_is_draft" == "true" ]]; then
            gh release edit "$release_tag" --draft=false --latest
            for attempt in 1 2 3 4 5 6; do
              tag_sha="$(resolve_tag_sha "$release_tag")"
              if [[ "$tag_sha" == "$MERGE_SHA" ]]; then
                break
              fi
              if [[ -n "$tag_sha" ]]; then
                echo "Published tag $release_tag points to $tag_sha instead of $MERGE_SHA" >&2
                exit 1
              fi
              if (( attempt < 6 )); then
                sleep 2
              fi
            done
          fi

          if [[ "$tag_sha" != "$MERGE_SHA" ]]; then
            echo "Published tag $release_tag points to $tag_sha instead of $MERGE_SHA" >&2
            exit 1
          fi

          validate_release_asset_allowlist
          for asset_name in "${expected_asset_names[@]}"; do
            asset_info="$(read_asset "$asset_name")"
            asset_state=""
            asset_digest=""
            if [[ -n "$asset_info" ]]; then
              IFS=$'\t' read -r asset_state asset_digest <<< "$asset_info"
            fi
            if [[ "$asset_state" != "uploaded" || \
                  "$asset_digest" != "${expected_digests[$asset_name]}" ]]; then
              echo "Published release asset verification failed for $asset_name" >&2
              exit 1
            fi
          done
