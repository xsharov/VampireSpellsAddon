name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute build version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          version_prefix="${base_version%.*}"
          base_patch="${base_version##*.}"

          if [[ -z "$base_version" || ! "$base_patch" =~ ^[0-9]+$ ]]; then
            echo "mod_version must end in a numeric patch component: $base_version" >&2
            exit 1
          fi

          build_version="${version_prefix}.$((base_patch + GITHUB_RUN_NUMBER))"
          echo "version=$build_version" >> "$GITHUB_OUTPUT"
          echo "Building version $build_version"

      - name: Build and verify
        run: ./gradlew --no-daemon clean build resolveParentRuntime --stacktrace -Pmod_version="${{ steps.version.outputs.version }}"

      - name: Smoke-test current parent runtime
        run: ./gradlew --no-daemon runGameTestServer --stacktrace -Pmod_version="${{ steps.version.outputs.version }}"

      - name: Smoke-test parent compatibility floors
        run: >-
          ./gradlew --no-daemon runGameTestServer --stacktrace
          -Pmod_version="${{ steps.version.outputs.version }}"
          -Pvampirism_runtime_version=1.21-1.10.7
          -Pirons_spells_runtime_version=1.21.1-3.14.3

      - name: Upload main JAR
        uses: actions/upload-artifact@v6
        with:
          name: vampire-spells-addon-${{ steps.version.outputs.version }}
          path: |
            build/libs/vampire_spells_addon-neoforge-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
